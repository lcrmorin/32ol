[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xgb2sql"
version = "0.1.0"
description = "Convert a trained tree model (XGBoost, scikit-learn) into SQL or SAS for in-database/in-process scoring"
readme = "README.md"
authors = [{ name = "lcrmorin" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "xgboost>=1.6",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7", "duckdb>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
