[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xgb2sql"
version = "0.2.0"
description = "Convert a trained tree model (XGBoost, scikit-learn, LightGBM, CatBoost) into SQL or SAS for in-database/in-process scoring"
readme = "README.md"
authors = [{ name = "lcrmorin" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

# Each source-model library is optional - install only the ones you actually
# use ("pip install xgb2sql[lightgbm]"), or "all" for every source model.
# xgb2sql/__init__.py imports each *_api module in its own try/except, so
# `import xgb2sql` itself never requires a library you don't have installed;
# calling a function whose library IS missing raises a clear ImportError
# naming the extra to install, instead of failing at import time.
[project.optional-dependencies]
xgboost = ["xgboost>=1.6"]
sklearn = ["scikit-learn>=1.3"]
lightgbm = ["lightgbm>=4.0"]
catboost = ["catboost>=1.2"]
all = ["xgb2sql[xgboost,sklearn,lightgbm,catboost]"]
test = ["xgb2sql[all]", "pytest>=7", "duckdb>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
